name: Update Chinese holidays

# Daily check. The script only fetches a year after December 15 of the last
# covered year, and retries every day until the next year's data is committed.
# A monthly heartbeat commit keeps GitHub from disabling this schedule after
# 60 days without repository activity.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-holidays
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the holiday table
        run: node scripts/update-holidays.mjs
      - name: Commit the result
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js data/checked.json
          if git diff --cached --quiet -- client.js; then
            message="chore: monthly holiday check"
          else
            message="chore: update Chinese holidays"
          fi
          git commit -m "$message"
          git push
